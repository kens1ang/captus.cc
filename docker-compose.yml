services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: captus
      POSTGRES_PASSWORD: captus
      POSTGRES_DB: captus
    ports:
      - "5432:5432"
    volumes:
      - captus_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  captus_pg_data:
